<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e11d34" />
    <meta name="description" content="Trinitas ERP — unified operations platform for Sales, Procurement, Warehouse, Maintenance, Finance and HR." />
    <title>Trinitas ERP</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var t = localStorage.getItem('trinitas.theme');
        if (!t || t === 'system') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
